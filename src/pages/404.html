{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found – NyxOps</title>
    <meta name="description"
        content="The page you were looking for could not be found." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/output.css' %}" />
    <script src="{% static 'js/navbar.js' %}" defer></script>
    <link rel="icon" type="image/png" href="/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
    <link rel="shortcut icon" href="/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="NyxOps" />
    <link rel="manifest" href="/favicon/site.webmanifest" />
</head>

<body class="bg-Bg-Light-grey font-sans antialiased">

    <!-- ════ HERO / NAV ════ -->
    <section class="bg-Main-Bl overflow-hidden relative">
        <div class="w-full max-w-[1240px] mx-auto px-5 pt-5 relative z-20">
            {% include 'partials/navbar.html' %}
        </div>

        <div class="w-full max-w-[1240px] mx-auto px-5 py-20 lg:py-28">
            <p class="text-white/40 text-xl font-bold uppercase tracking-widest mb-6">404</p>
            <h1 class="text-Main-Wh text-5xl md:text-7xl font-bold leading-tight tracking-tight"
                style="max-width:700px; line-height:1.05;">
                Page not found.
            </h1>
            <p class="text-white/60 text-xl md:text-2xl font-normal leading-relaxed mt-8" style="max-width:520px;">
                The page you're looking for doesn't exist or has moved.
            </p>
        </div>
    </section>

    <section class="bg-Bg-Light-grey py-28">
        <div class="w-full max-w-[1240px] mx-auto px-5 flex flex-wrap gap-4">
            <a href="/"
                    class="pl-6 pr-1 py-1 bg-Main-Bl rounded-full inline-flex items-center gap-5 transition-all duration-300 group hover:bg-[#1a7be0]">
                    <span class="text-Main-Wh text-xl font-semibold">Back to home</span>
                    <span class="p-2 bg-Main-Wh rounded-full flex items-center justify-center group-hover:bg-[#1a7be0] transition-colors duration-300">
                        <img src="{% static 'icons/arrow-right-bl.svg' %}" alt="" class="w-5 h-5 object-contain group-hover:hidden" />
                        <img src="{% static 'icons/arrow-right-wh.svg' %}" alt="" class="w-5 h-5 object-contain hidden group-hover:block" />
                    </span>
                </a>
            <a href="/cyber-essentials"
                    class="pl-6 pr-1 py-1 bg-Main-Bl rounded-full inline-flex items-center gap-5 transition-all duration-300 group hover:bg-[#1a7be0]">
                    <span class="text-Main-Wh text-xl font-semibold">Cyber Essentials</span>
                    <span class="p-2 bg-Main-Wh rounded-full flex items-center justify-center group-hover:bg-[#1a7be0] transition-colors duration-300">
                        <img src="{% static 'icons/arrow-right-bl.svg' %}" alt="" class="w-5 h-5 object-contain group-hover:hidden" />
                        <img src="{% static 'icons/arrow-right-wh.svg' %}" alt="" class="w-5 h-5 object-contain hidden group-hover:block" />
                    </span>
                </a>
        </div>
    </section>

    {% include 'partials/footer.html' %}

</body>

</html>
